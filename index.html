<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#ff4fd8,#4da6ff);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:900px;
    background:rgba(0,0,0,.45);
    border-radius:20px;
    padding:40px;
    text-align:center;

h1{
    font-size:55px;
    margin-bottom:10px;
}

.subtitle{
    color:#ddd;
    margin-bottom:35px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1d1d1d;
    border-radius:15px;
    padding:25px;
    transition:.25s;
}

.card:hover{
    transform:translateY(-8px);
}

.price{
    font-size:42px;
    margin:15px 0;
    color:#4da6ff;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    background:#ff4fd8;
    color:white;
    transition:.25s;
}

button:hover{
    background:#ff79e6;
}

footer{
    margin-top:40px;
    color:#ccc;
}
</style>

</head>

</p>

<div class="price">$10</div>
